version: 2

project_name: goilerplate

builds:
  - id: goilerplate
    main: ./cmd/goilerplate
    binary: goilerplate
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Tag}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: goilerplate
    ids:
      - goilerplate
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  prerelease: auto
