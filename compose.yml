# goilerplate.com, deployed by ops: every push to main goes live on prod-01.
# https://ops.goilerplate.com/docs/guides/config
x-ops:
  app: goilerplate
  server: prod-01
  port: 8090
  health: /healthz
  domains: [goilerplate.com, www.goilerplate.com]
  canonical: goilerplate.com

services:
  site:
    build:
      context: .
      dockerfile: site/Dockerfile
