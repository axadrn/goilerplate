# goilerplate.com, deployed by moin: every push to main goes live on prod-01.
# https://moin.run/docs/guides/config
x-moin:
  app: goilerplate
  server: prod-01
  port: 8090
  health: /healthz
  domains: [goilerplate.com, www.goilerplate.com]
  canonical: goilerplate.com

services:
  site:
    build:
      context: .
      dockerfile: site/Dockerfile
