services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: goilerplate_dev
      POSTGRES_USER: goilerplate
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goilerplate -d goilerplate_dev"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
