# goilerplate.com behind Traefik. The deploy workflow copies this file to the
# server and sets IMAGE_TAG.
services:
  site:
    image: ghcr.io/axadrn/goilerplate.com:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.goilerplate.rule: Host(`goilerplate.com`) || Host(`www.goilerplate.com`)
      traefik.http.routers.goilerplate.entrypoints: web
      traefik.http.routers.goilerplate.middlewares: goilerplate-www-redirect
      traefik.http.middlewares.goilerplate-www-redirect.redirectregex.regex: ^https?://www\.goilerplate\.com/(.*)
      traefik.http.middlewares.goilerplate-www-redirect.redirectregex.replacement: https://goilerplate.com/$${1}
      traefik.http.middlewares.goilerplate-www-redirect.redirectregex.permanent: "true"
      traefik.http.services.goilerplate.loadbalancer.server.port: "8090"

networks:
  proxy:
    external: true
