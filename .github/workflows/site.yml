name: Site

# Builds goilerplate.com and deploys it to the server behind Traefik and
# Cloudflare. Every server detail is a repository secret or variable:
#   vars.SITE_DEPLOY      "true" turns deploys on
#   vars.DEPLOY_HOST      the Tailscale name of the server
#   vars.DEPLOY_PATH      the directory of compose.yml on the server
#   secrets.TS_OAUTH_CLIENT_ID  the Tailscale OAuth client for CI

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - content/**
      - CHANGELOG.md
      - generator/_template/assets.htmx.datastar/img/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.SITE_DEPLOY == 'true'
    runs-on: ubuntu-24.04-arm
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: site/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/axadrn/goilerplate.com:latest
            ghcr.io/axadrn/goilerplate.com:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to the server through Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: api.tailscale.com/${{ secrets.TS_OAUTH_CLIENT_ID }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Sync the compose file
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          DIR: ${{ vars.DEPLOY_PATH }}
        run: tailscale ssh "root@$HOST" "mkdir -p '$DIR' && cat > '$DIR/compose.yml'" < site/compose.yml

      - name: Log the server into GHCR
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | tailscale ssh "root@$HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy and wait for health
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          DIR: ${{ vars.DEPLOY_PATH }}
        run: tailscale ssh "root@$HOST" "cd '$DIR' && IMAGE_TAG='$GITHUB_SHA' docker compose up -d --pull always --wait --wait-timeout 60"

      - name: Log the server out of GHCR
        if: always()
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
        run: tailscale ssh "root@$HOST" 'docker logout ghcr.io'
