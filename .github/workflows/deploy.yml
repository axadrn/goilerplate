# Builds the image and pushes it to ghcr.io. The server follows the image.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: site/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/axadrn/goilerplate.com:${{ github.sha }}
            ghcr.io/axadrn/goilerplate.com:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
