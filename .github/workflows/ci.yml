name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify module files
        shell: bash
        run: go mod tidy -diff

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/goilerplate

      - name: Check generated templ files
        shell: bash
        run: |
          go tool templ generate -path site
          git diff --exit-code -- site

  race:
    name: race
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test with race detector
        run: go test -race ./...

  site:
    name: site
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Tailwind CSS
        env:
          TAILWIND_URL: https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          TAILWIND_SHA256: dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a
        run: |
          curl --fail --location --silent --show-error "$TAILWIND_URL" --output "$RUNNER_TEMP/tailwindcss"
          echo "$TAILWIND_SHA256  $RUNNER_TEMP/tailwindcss" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/tailwindcss"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Test the stack builder script
        run: node --test site/test/configurator.test.js

      - name: Build the site
        run: |
          tailwindcss -i site/assets/css/globals.css -o site/assets/css/output.css --minify
          go run ./site/cmd/build -stars=false

  generated-project:
    name: generated / ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - headless-stripe-sqlite
          - headless-workspaces-polar-postgres-resend
          - postgres-resend-datastar
          - sqlite-htmx
          - svelte-stripe-sqlite
          - svelte-workspaces-polar-postgres-resend
          - workspaces-polar-resend-htmx
          - workspaces-stripe-postgres-datastar
          - workspaces-stripe-postgres-htmx

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: generator/_template/go.sum

      - name: Generate project
        env:
          CONFIG: ${{ matrix.config }}
        run: go run ./generator/cmd/render -out "$RUNNER_TEMP/project" -config "generator/testdata/configs/$CONFIG.json" -version v4.0.0-ci

      - name: Set up Node.js
        if: contains(matrix.config, 'svelte')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up pnpm
        if: contains(matrix.config, 'svelte')
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: generator/_template/web.svelte/package.json

      - name: Check and build web app
        if: contains(matrix.config, 'svelte')
        working-directory: ${{ runner.temp }}/project/web
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      - name: Verify generated project
        env:
          PROJECT: ${{ runner.temp }}/project
        run: |
          cd "$PROJECT"
          if find . -name '*.templ' -print -quit | grep -q .; then
            go tool templ generate
          fi
          cp go.mod "$RUNNER_TEMP/go.mod.before"
          cp go.sum "$RUNNER_TEMP/go.sum.before"
          go mod tidy
          diff --unified "$RUNNER_TEMP/go.mod.before" go.mod
          test -z "$(comm -13 <(sort "$RUNNER_TEMP/go.sum.before") <(sort go.sum))"
          go mod verify
          go build ./...
          go vet ./...
          go test -race ./...

  release-snapshot:
    name: release snapshot
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean
